# DTAA Default Configuration
project:
  name: "dtaa-federated-trauma-ct"
  version: "1.0.0"
  author: "Abdulquadri Olanrewaju Adegbiji"
  institution: "University of Lagos, Department of Computer Science"

model:
  in_channels: 1
  num_classes: 6
  feature_channels: [8, 16, 32, 64, 128]
  dropout_rate: 0.05
  num_groups: 8

data:
  window_center: 50.0
  window_width: 400.0
  hu_min: -150.0
  hu_max: 250.0
  batch_size: 8
  test_split: 0.15

federated:
  num_clients: 4
  labeled_ratios: [0.80, 0.25, 0.15, 0.08]
  total_rounds: 20
  local_epochs: 1
  learning_rate: 0.006
  weight_decay: 0.0001
  ema_alpha: 0.90

agreement:
  tau_max: 0.95
  tau_min: 0.70
  lambda_max: 1.0
  manifold_weight: 0.10

loss:
  dice_weight: 0.60
  focal_weight: 0.40
  gamma: 2.0
  class_weights: [0.2, 1.0, 1.5, 2.0, 1.4, 5.0]
